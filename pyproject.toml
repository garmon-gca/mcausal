[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcausal"
version = "0.1.1"
description = "Causal training diagnostics for PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mangust" }]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/garmon-gca/mcausal"
Issues = "https://github.com/garmon-gca/mcausal/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mcausal = "mcausal.cli:main"
mcausal-ref = "mcausal.reference_suite:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
